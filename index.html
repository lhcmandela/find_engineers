<!DOCTYPE html>
<html lang="en" data-accent="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Find Engineers">
<meta name="description" content="Find a verified electrician or electrical engineer in Accra. Demo with sample data.">
<title>Find Engineers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
/* Apple system palette: grouped background, white cards, one tint.
   The tint has four options (More > Colour) so the owner can pick one.
   Dark mode follows the phone. */
:root{
  color-scheme:light;
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--sheet:#FFFFFF;--hl:#E5E5EA;
  --label:#000000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);
  --fill:rgba(120,120,128,.12);--seg-on:#FFFFFF;
  --tint:#3F51D8;--tint-soft:rgba(63,81,216,.12);--tint-fill:#3F51D8;
  --green:#34C759;--green-t:#248A3D;--orange:#FF9500;--orange-t:#C35A00;--red:#FF3B30;
  --overlay:rgba(0,0,0,.28);
  --glass-bg:rgba(255,255,255,.62);--glass-brd:rgba(255,255,255,.8);
  --glass-shadow:0 8px 30px rgba(0,0,0,.10),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.035);
  --tabidle:#3C3C43;--hud:rgba(236,236,240,.96);--desk:#E5E5EA;
}
:root[data-accent="sea"]{--tint:#0A7CC1;--tint-soft:rgba(10,124,193,.12);--tint-fill:#0A7CC1}
:root[data-accent="teal"]{--tint:#0B7F74;--tint-soft:rgba(11,127,116,.12);--tint-fill:#0B7F74}
:root[data-accent="violet"]{--tint:#7442C8;--tint-soft:rgba(116,66,200,.12);--tint-fill:#7442C8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--hl:#3A3A3C;
    --label:#FFFFFF;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.26);--seg-on:#636366;
    --tint:#8391FF;--tint-soft:rgba(131,145,255,.2);--tint-fill:#5464E8;
    --green:#30D158;--green-t:#30D158;--orange:#FF9F0A;--orange-t:#FF9F0A;--red:#FF453A;
    --overlay:rgba(0,0,0,.5);
    --glass-bg:rgba(46,46,50,.58);--glass-brd:rgba(255,255,255,.13);
    --glass-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.13);
    --tabidle:#D1D1D6;--hud:#2C2C2E;--desk:#0B0B0C;
  }
  :root:not([data-theme="light"])[data-accent="sea"]{--tint:#40B4F2;--tint-soft:rgba(64,180,242,.18);--tint-fill:#0A84C8}
  :root:not([data-theme="light"])[data-accent="teal"]{--tint:#3CCFBE;--tint-soft:rgba(60,207,190,.18);--tint-fill:#0E8C7E}
  :root:not([data-theme="light"])[data-accent="violet"]{--tint:#B48CFF;--tint-soft:rgba(180,140,255,.2);--tint-fill:#8452D9}
}
/* an explicit dark choice wins too */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--hl:#3A3A3C;
  --label:#FFFFFF;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --fill:rgba(120,120,128,.26);--seg-on:#636366;
  --tint:#8391FF;--tint-soft:rgba(131,145,255,.2);--tint-fill:#5464E8;
  --green:#30D158;--green-t:#30D158;--orange:#FF9F0A;--orange-t:#FF9F0A;--red:#FF453A;
  --overlay:rgba(0,0,0,.5);
  --glass-bg:rgba(46,46,50,.58);--glass-brd:rgba(255,255,255,.13);
  --glass-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.13);
  --tabidle:#D1D1D6;--hud:#2C2C2E;--desk:#0B0B0C;
}
:root[data-theme="dark"][data-accent="sea"]{--tint:#40B4F2;--tint-soft:rgba(64,180,242,.18);--tint-fill:#0A84C8}
:root[data-theme="dark"][data-accent="teal"]{--tint:#3CCFBE;--tint-soft:rgba(60,207,190,.18);--tint-fill:#0E8C7E}
:root[data-theme="dark"][data-accent="violet"]{--tint:#B48CFF;--tint-soft:rgba(180,140,255,.2);--tint-fill:#8452D9}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.011em;overflow:hidden;
}
#root{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.vs-shell{width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.vs-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:560px){
  body{background:var(--desk)}
  .vs-shell{height:calc(100% - 48px);max-height:900px;margin:auto;border-radius:44px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px -20px rgba(0,0,0,.28)}
}
input,button,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-appearance:none;appearance:none}
::selection{background:var(--tint-soft)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vs-press:active{opacity:.6}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px}

/* ---- type ---- */
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:-.005em}
.lt{font-size:34px;font-weight:700;letter-spacing:-.028em;line-height:41px}
.lsub{font-size:15px;color:var(--sec);margin-top:1px;letter-spacing:-.012em}
.px{padding-left:16px;padding-right:16px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:26px 4px 10px}
.sh b{font-size:22px;font-weight:700;letter-spacing:-.026em}
.caps{font-size:13px;color:var(--sec);text-transform:uppercase;padding:22px 4px 7px;letter-spacing:-.005em}
.foot{font-size:13px;color:var(--sec);padding:8px 4px 0;line-height:1.4}
.link{border:none;background:none;padding:0;color:var(--tint);font-size:17px;letter-spacing:-.02em;cursor:pointer}

/* ---- surfaces + lists ---- */
.card{background:var(--card);border-radius:22px}
.group{background:var(--card);border-radius:22px;overflow:hidden}
.li{position:relative;background:var(--card)}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,64px);height:.5px;background:var(--sep);z-index:3}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.vrow.sm{min-height:48px;padding:8px 16px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:var(--hl)}
.tx{flex:1;min-width:0}
.tt{font-size:17px;font-weight:600;letter-spacing:-.022em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tt>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.st{font-size:15px;color:var(--sec);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.012em}
.am{font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--ter);display:flex;flex-shrink:0;margin-left:-2px}
.vrow.wrap .tt,.vrow.wrap .tt>span,.vrow.wrap .st{white-space:normal;line-height:1.25}
.vrow.wrap .st{margin-top:2px}
.st2{font-size:14px;color:var(--sec);margin-top:2px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.mono{border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tint-fill) 55%,#fff),var(--tint-fill))}
.mono.grey{background:linear-gradient(180deg,#A9B1BC,#7F8893)}
.empty{padding:22px 18px;text-align:center;color:var(--sec);font-size:15px;line-height:1.45}

/* ---- controls ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;font-weight:600;letter-spacing:-.02em;cursor:pointer;width:100%}
.btnrow{display:flex;gap:10px}
.seg{height:36px;border-radius:18px;background:var(--fill);display:flex;padding:2px}
.seg button{flex:1;min-width:0;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--label);border-radius:16px;cursor:pointer;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{position:relative;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--label);border:none;cursor:pointer;white-space:nowrap;letter-spacing:-.015em;flex-shrink:0}
.chip.on{background:var(--tint-soft);color:var(--tint)}
.chip.static{cursor:default}
.get{height:30px;padding:0 15px;border-radius:15px;background:var(--tint-soft);color:var(--tint);font-weight:700;font-size:15px;display:flex;align-items:center;letter-spacing:-.01em;flex-shrink:0;border:none;cursor:pointer}
.sw{width:51px;height:31px;border-radius:16px;border:none;background:var(--fill);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;padding:0}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .22s}
.sw.on{background:var(--green)} .sw.on i{transform:translateX(20px)} .sw:disabled{opacity:.4}
.ta{width:100%;min-height:88px;border:none;outline:none;border-radius:16px;background:var(--card2);padding:12px 14px;font-size:17px;color:var(--label);letter-spacing:-.02em;resize:none;line-height:1.35;display:block}
.ta::placeholder{color:var(--ter)}
.sheet .ta{background:var(--fill)}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--fill);padding:0 10px;color:var(--sec)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:17px;color:var(--label);letter-spacing:-.02em;height:100%}
.search input::placeholder{color:var(--sec)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);margin:6px -4px 0}
.kkey{height:56px;border:none;background:transparent;font-size:28px;font-weight:400;color:var(--label);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kkey:active{background:var(--fill)}
.bigamt{text-align:center;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bigamt small{font-size:26px;font-weight:600;color:var(--sec);letter-spacing:-.02em;vertical-align:top;position:relative;top:7px;margin-right:6px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 12px;border:none;border-radius:16px;background:var(--card);text-align:left;cursor:pointer;color:var(--label);min-width:0}
.sheet .cat{background:var(--card2)}
.cat.on{box-shadow:inset 0 0 0 2px var(--tint)}
.cat span{font-size:15px;font-weight:500;letter-spacing:-.015em;line-height:1.25;overflow-wrap:anywhere;min-width:0}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:10px;height:34px;padding:0 2px}
.stepper button{width:40px;height:30px;border:none;background:transparent;color:var(--label);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.stepper button:disabled{opacity:.3}
.stepper b{min-width:22px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---- liquid glass ---- */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);border:.5px solid var(--glass-brd);box-shadow:var(--glass-shadow)}
.gbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label);cursor:pointer;padding:0;flex-shrink:0}
.navrow{height:56px;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0;position:relative;z-index:2}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.022em;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.tabbar{position:absolute;left:12px;right:88px;bottom:calc(max(env(safe-area-inset-bottom,0px),20px) - 6px);height:64px;border-radius:32px;display:flex;padding:4px;z-index:30}
.tabbar.wide{right:12px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:none;background:transparent;border-radius:28px;font-size:10px;font-weight:600;color:var(--tabidle);cursor:pointer;padding:0;letter-spacing:0;position:relative}
.tab.on{color:var(--tint);background:var(--fill)}
.tab .dotn{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:absolute;right:12px;bottom:calc(max(env(safe-area-inset-bottom,0px),20px) - 6px);width:64px;height:64px;border-radius:50%;z-index:30;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0}
.fab.glass{background:var(--tint-fill);background:color-mix(in srgb,var(--tint-fill) 88%,transparent);border-color:rgba(255,255,255,.4)}
.edgefade{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:20;pointer-events:none;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 88%,transparent) 70%)}
.menu-ov{position:absolute;inset:0;z-index:40;touch-action:none}
.sheet-open .vs-scroll{overflow:hidden;touch-action:none}
.sheet-open,.sheet-open body{overscroll-behavior:none}
.menu{position:absolute;z-index:41;min-width:250px;border-radius:22px;padding:6px;animation:vpop .18s ease}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:48px;padding:0 14px;border:none;background:transparent;font-size:17px;letter-spacing:-.02em;border-radius:14px;cursor:pointer;color:var(--label)}
.mi:active{background:var(--fill)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:60;max-width:calc(100% - 140px);pointer-events:none;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:rgba(28,28,30,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:15px;font-weight:500;letter-spacing:-.015em;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:vfade .2s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- sheets ---- */
.ov{position:fixed;inset:0;overscroll-behavior:contain;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:vfade .2s ease}
.sheet{background:var(--sheet);width:100%;max-width:430px;max-height:94%;border-radius:38px 38px 0 0;display:flex;flex-direction:column;animation:vup .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:7px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 6px;flex-shrink:0;gap:8px}
.stitle{font-size:17px;font-weight:600;letter-spacing:-.022em;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{background:var(--fill);border:none}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.slab{font-size:13px;color:var(--sec);text-transform:uppercase;padding:18px 4px 8px;letter-spacing:-.005em}
.slab:first-child{padding-top:6px}
.sgroup{background:var(--card2);border-radius:16px;overflow:hidden}
.sgroup .li{background:var(--card2)}
.done{position:fixed;left:50%;top:44%;z-index:80;min-width:156px;max-width:250px;padding:20px 20px 16px;border-radius:26px;text-align:center;pointer-events:none;color:#fff;
  background:rgba(28,28,30,.84);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 18px 50px -12px rgba(0,0,0,.35);
  transform:translate(-50%,-50%);animation:vdoneIn .2s cubic-bezier(.2,.9,.3,1) both,vdoneOut .24s ease-in 1s forwards}
.done-ic{width:50px;height:50px;display:block;margin:0 auto 10px}
.done-c{fill:#30D158;transform-origin:26px 26px;animation:vdoneRing .32s cubic-bezier(.2,.9,.3,1.15) both}
.done-k{fill:none;stroke:#fff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:32;stroke-dashoffset:32;animation:vdoneDraw .3s .14s ease-out forwards}
.done-t{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
@keyframes vdoneIn{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes vdoneOut{to{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
@keyframes vdoneRing{from{transform:scale(.55)}to{transform:scale(1)}}
@keyframes vdoneDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.done-k{stroke-dashoffset:0}}
@keyframes vup{from{transform:translateY(100%)}to{transform:none}}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes vpop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ---- home ---- */
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#A9B1BC,#7F8893);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:3px;border:none;cursor:pointer;flex-shrink:0;padding:0}
.hero{border-radius:24px;position:relative;overflow:hidden;color:#fff;padding:16px 20px 18px;
  background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--tint-fill) 45%,#fff) 0%,transparent 62%),linear-gradient(160deg,color-mix(in srgb,var(--tint-fill) 92%,#fff) 0%,color-mix(in srgb,var(--tint-fill) 70%,#000) 100%);
  box-shadow:0 14px 30px -14px color-mix(in srgb,var(--tint-fill) 70%,#000)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 38%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.htop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hbrand{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.demo{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.22)}

.harea{display:inline-flex;align-items:center;gap:6px;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:2px;border:none;background:none;color:#fff;padding:0;cursor:pointer;max-width:100%;text-align:left}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qa{background:var(--card);border:none;border-radius:22px;padding:16px 16px 15px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--label);cursor:pointer;min-width:0;min-height:124px}
.qt{font-size:19px;font-weight:700;letter-spacing:-.025em;margin-top:auto;padding-top:14px}
.qs{font-size:13px;color:var(--sec);margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:22px;padding:14px 16px}
.banner.danger{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 40%,transparent)}

.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--sec);line-height:1.4;padding:12px 14px;border-radius:16px;background:var(--tint-soft)}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;flex-shrink:0}
.pill.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-t)}
.pill.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t)}
.pill.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}

.pill.grey{background:var(--fill);color:var(--sec)}
.cred{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--card);font-size:14px;font-weight:600;color:var(--label);letter-spacing:-.012em;white-space:nowrap}

.ppage{position:relative}
.poster{position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 30%,var(--bg)) 0%,color-mix(in srgb,var(--tint) 12%,var(--bg)) 45%,var(--bg) 100%)}

function kmBetween(a, b) {
  const A = areaOf(a), B = areaOf(b), R = 6371, r = Math.PI / 180;
  const dLat = (B.lat - A.lat) * r, dLng = (B.lng - A.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(A.lat * r) * Math.cos(B.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

/* matching (spec §6): verified + offers the category + serves the area
   (or within 12 km); sorted available → rating → reply speed → jobs */
function matchPros(pros, { cat, area }) {
  return pros
    .filter((p) => p.cats.includes(cat) && (p.areas.includes(area) || kmBetween(p.base, area) <= 12))
    .map((p) => ({ ...p, km: kmBetween(p.base, area) }))
    .sort((a, b) => (b.available - a.available) || (b.rating - a.rating) || (a.reply - b.reply) || (b.jobs - a.jobs));
}

/* ---------- sheets: portalled, page frozen behind ---------- */
let openSheets = 0;
function useSheetLock(ovRef, bodyRef) {
  useEffect(() => {
    openSheets += 1;
    document.documentElement.classList.add("sheet-open");
    const ov = ovRef.current;
    const guard = (e) => {
      const b = bodyRef.current;
      if (!b || !b.contains(e.target) || b.scrollHeight <= b.clientHeight + 1) { e.preventDefault(); return; }
      const atTop = b.scrollTop <= 0 && e.deltaY < 0;
      const atEnd = b.scrollTop + b.clientHeight >= b.scrollHeight - 1 && e.deltaY > 0;
      if (atTop || atEnd) e.preventDefault();
    };
    let startY = 0;
    const onStart = (e) => { if (e.touches && e.touches[0]) startY = e.touches[0].clientY; };
    const onMove = (e) => {
      const b = bodyRef.current;
      if (!b || !b.contains(e.target) || b.scrollHeight <= b.clientHeight + 1) {
        if (!(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
        return;
      }
      const dy = e.touches && e.touches[0] ? e.touches[0].clientY - startY : 0;
      if ((b.scrollTop <= 0 && dy > 0) || (b.scrollTop + b.clientHeight >= b.scrollHeight - 1 && dy < 0)) e.preventDefault();
    };
    ov.addEventListener("wheel", guard, { passive: false });
    ov.addEventListener("touchstart", onStart, { passive: true });
    ov.addEventListener("touchmove", onMove, { passive: false });
    return () => {
      ov.removeEventListener("wheel", guard);
      ov.removeEventListener("touchstart", onStart);
      ov.removeEventListener("touchmove", onMove);
      openSheets = Math.max(0, openSheets - 1);
      if (!openSheets) document.documentElement.classList.remove("sheet-open");
    };
  }, []);
}
function Sheet({ title, onClose, onBack, children, right }) {
  const ovRef = useRef(null);
  const bodyRef = useRef(null);
  useSheetLock(ovRef, bodyRef);
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [onClose]);
  return ReactDOM.createPortal(
    <div className="ov" ref={ovRef} onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label={title}>
        <div className="grab" />
        <div className="shead">
          {onBack ? (
            <button className="gbtn sx" onClick={onBack} aria-label="Back"><ChevronLeft size={18} strokeWidth={2.6} /></button>
          ) : (
            <button className="gbtn sx" onClick={onClose} aria-label="Close"><XMark size={17} strokeWidth={2.6} /></button>
          )}
          <div className="stitle">{title}</div>
          {right || <span style={{ width: 44, flexShrink: 0 }} />}
        </div>
        <div className="sbody" ref={bodyRef}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

/* ============================================================ */
function App() {
  const [st, setSt] = useState(load);
  const [tab, setTab] = useState("home");
  const [stack, setStack] = useState([]); /* pushed pages */
  const [sheet, setSheet] = useState(null);
  const [areaFor, setAreaFor] = useState(null); /* area picker on top of a sheet */
  const [menu, setMenu] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [done, setDone] = useState(null);
  const [now, setNow] = useState(Date.now());
  /* screen state (search text, filters, ticks) lives here so the
     once-a-second demo clock never resets it */
  const [ui, setUi] = useState({ q: "", kind: "all", fcat: null, fnow: false, reqView: "active", checks: {} });
  const setU = (patch) => setUi((u) => ({ ...u, ...patch }));
  const scrollRef = useRef(null);
  const stRef = useRef(st);
  stRef.current = st;

  /* every change is saved; the HUD only shows after a successful save */
  const commit = (fn, okMsg) => {
    const next = fn(stRef.current);
    stRef.current = next;
    setSt(next);
    const ok = save(next);
    if (okMsg) {
      if (ok) setDone({ key: uid(), msg: okMsg });
      else toast("Not saved on this phone. Please try again.");
    }
    return ok;
  };
  const toast = (m) => setToastMsg({ m, k: uid() });
  useEffect(() => {
    if (!toastMsg) return;
    const t = setTimeout(() => setToastMsg(null), 2600);
    return () => clearTimeout(t);
  }, [toastMsg]);
  useEffect(() => {
    if (!done) return;
    const t = setTimeout(() => setDone(null), 1350);
    return () => clearTimeout(t);
  }, [done]);
  useEffect(() => { document.documentElement.dataset.accent = st.accent || "indigo"; }, [st.accent]);
  useEffect(() => {
    const p = new URLSearchParams(location.search).get("accent");
    if (p && ["indigo", "sea", "teal", "violet"].includes(p)) document.documentElement.dataset.accent = p;
  }, []);
  useEffect(() => { if (!st.seenWelcome) setSheet({ type: "welcome" }); }, []);

  /* the demo "network": professionals accept after a few seconds,
     project quotes arrive one by one */
  useEffect(() => {
    const t = setInterval(() => {
      const s = stRef.current, n = Date.now();
      let changed = false, msg = null;
      const requests = s.requests.map((r) => {
        if (r.status === "sent" && n - r.sentAt > 5000) {
          changed = true;
          msg = firstName(proById(r.proId, s).name) + " accepted your request";
          return { ...r, status: "accepted", acceptedAt: n };
        }
        return r;
      });
      const projects = s.projects.map((p) => {
        if (p.status !== "open" || p.quotes.length >= 3) return p;
        const due = Math.floor((n - p.postedAt) / 4000);
        if (due > p.quotes.length && p.candidates[p.quotes.length]) {
          changed = true;
          const i = p.quotes.length, shape = QUOTE_SHAPES[i], pro = proById(p.candidates[i], s);
          msg = "New quote from " + firstName(pro.name);
          const base = sampleQuote(p.cat, p.rooms);
          return { ...p, quotes: [...p.quotes, { proId: pro.id, amount: Math.round((base * shape.k) / 50) * 50, materials: shape.materials, days: shape.days(p.cat), note: shape.note, at: n }] };
        }
        return p;
      });
      if (changed) {
        commit((x) => ({ ...x, requests, projects }));
        if (msg) toast(msg);
      }
      setNow(n);
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const allPros = useMemo(() => [...SAMPLE_PROS, ...SAMPLE_APPLICANTS.filter((a) => st.approved.includes(a.id))], [st.approved]);
  function proById(id, s = st) {
    return SAMPLE_PROS.find((p) => p.id === id) || SAMPLE_APPLICANTS.find((p) => p.id === id) || SAMPLE_PROS[0];
  }

  const page = stack[stack.length - 1] || null;
  const push = (p) => { setStack([...stack, p]); setMenu(null); };
  const pop = () => setStack(stack.slice(0, -1));
  const goTab = (t) => { setTab(t); setStack([]); setMenu(null); };
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab, stack.length]);

  const setArea = (a) => { commit((s) => ({ ...s, area: a })); setAreaFor(null); };
  const openFix = (cat) => setSheet({ type: "fix", cat });
  const openBuild = () => setSheet({ type: "build" });

  const isPro = st.mode === "pro";
  const pendingApplicants = SAMPLE_APPLICANTS.filter((a) => !st.approved.includes(a.id) && !st.rejected.includes(a.id)).length;
  const inboxOpen = SAMPLE_INBOX.filter((i) => !st.pro.accepted.includes(i.id) && !st.pro.declined.includes(i.id));

  /* ---------------- actions ---------------- */
  const sendRequest = (pro, query) => {
    const r = { id: uid(), kind: "fix", cat: query.cat, urgency: query.urgency, note: query.note, area: st.area, proId: pro.id, status: "sent", sentAt: Date.now() };
    const ok = commit((s) => ({ ...s, requests: [r, ...s.requests] }), "Request sent to " + firstName(pro.name));
    if (ok) { setSheet(null); setTab("requests"); setStack([{ type: "request", id: r.id }]); }
  };
  const postProject = (d) => {
    const cands = matchPros(allPros, { cat: d.cat, area: st.area }).slice(0, 3).map((p) => p.id);
    const p = { id: uid(), kind: "build", ...d, area: st.area, postedAt: Date.now(), quotes: [], candidates: cands, status: "open" };
    const ok = commit((s) => ({ ...s, projects: [p, ...s.projects] }), "Project posted");
    if (ok) { setSheet(null); setTab("requests"); setStack([{ type: "project", id: p.id }]); }
  };

  /* ---------------- pages ---------------- */
  function NavBar({ title, right }) {
    return (
      <div className="navrow">
        <button className="gbtn glass" onClick={pop} aria-label="Back"><ChevronLeft size={21} strokeWidth={2.4} /></button>
        <div className="navtitle">{title || ""}</div>
        {right || <span style={{ width: 44 }} />}
      </div>
    );
  }

  function ResultsPage({ query }) {
    const onlyNow = page.onlyNow != null ? page.onlyNow : query.urgency === "now";
    const setOnlyNow = (v) => setStack((s) => [...s.slice(0, -1), { ...s[s.length - 1], onlyNow: v }]);
    const list = matchPros(allPros, { cat: query.cat, area: st.area });
    const now_ = list.filter((p) => p.available);
    const later = list.filter((p) => !p.available);
    const c = catOf(query.cat);
    return (
      <>
        {NavBar({ title: c.label })}
        <div className="px">
          {query.urgency === "now" || c.danger ? (
            <div className="banner danger" style={{ marginTop: 6 }}>
              <Warn size={24} color="var(--red)" />
              <div>
                <div className="bt">While you wait</div>
                <div className="bs">Keep the power off at the main breaker and don't touch the fault. Fire or smoke: leave and call 192 or 112.</div>
              </div>
            </div>
          ) : null}
          <div style={{ fontSize: 15, color: "var(--sec)", padding: "16px 4px 0" }}>

    const list = allPros
      .map((p) => ({ ...p, km: kmBetween(p.base, st.area) }))
      .filter((p) => kind === "all" || (kind === "eng" ? p.eng : !p.eng))
      .filter((p) => !cat || p.cats.includes(cat))
      .filter((p) => !onlyNow || p.available)
      .filter((p) => !t || p.name.toLowerCase().includes(t) || p.areas.some((a) => a.toLowerCase().includes(t)) || p.cats.some((c) => catOf(c).label.toLowerCase().includes(t)))

  /* ---------------- admin ---------------- */
  function AdminPage() {
    const pending = SAMPLE_APPLICANTS.filter((a) => !st.approved.includes(a.id) && !st.rejected.includes(a.id));
    const decided = SAMPLE_APPLICANTS.filter((a) => st.approved.includes(a.id) || st.rejected.includes(a.id));
    return (
      <>
        {NavBar({ title: "Verification" })}
        <div className="px">
          <div className="note" style={{ marginTop: 6 }}>
            <ShieldCheck size={20} color="var(--tint)" />
            <div>Nobody can receive requests until their documents are checked here. Approved people appear in search straight away.</div>
          </div>
          <div className="caps">Waiting ({pending.length})</div>
          {pending.length ? (
            <div className="group">
              {pending.map((a) => (
                <Item key={a.id} onClick={() => push({ type: "applicant", id: a.id })}>
                  <RowBody lead={<Mono name={a.name} size={40} grey />} title={a.name} sub={a.level + " · " + a.submitted} chevron />
                </Item>
              ))}
            </div>
          ) : <div className="card empty">Queue is empty.</div>}
          {decided.length ? (
            <>
              <div className="caps">Decided</div>
              <div className="group">
                {decided.map((a) => (
                  <Item key={a.id} onClick={() => push({ type: "applicant", id: a.id })}>
                    <RowBody lead={<Mono name={a.name} size={40} grey />} title={a.name} sub={a.level}
                      right={st.approved.includes(a.id) ? <span className="pill green">Approved</span> : <span className="pill red">Rejected</span>} chevron />
                  </Item>
                ))}
              </div>
            </>
          ) : null}
        </div>
        <Spacer />
      </>
    );

  function ApplicantPage({ id }) {
    const a = SAMPLE_APPLICANTS.find((x) => x.id === id);
    const checks = ui.checks[a.id] || { card: false, ec: false, eng: false };
    const setChecks = (c) => setU({ checks: { ...ui.checks, [a.id]: c } });
    const need = ["card", ...(a.docs.ecNo ? ["ec"] : []), ...(a.eng ? ["eng"] : [])];
    const missingEc = !a.docs.ecNo;
    const ready = !missingEc && need.every((k) => checks[k]);
    const decided = st.approved.includes(a.id) ? "approved" : st.rejected.includes(a.id) ? "rejected" : null;
    const Row = ({ k, title, sub, value }) => (
      <div className="li vrow wrap" style={{ "--inset": "16px" }}>
        <div className="tx"><div className="tt"><span>{title}</span></div><div className="st">{value || sub}</div></div>
        {decided ? null : <Switch on={checks[k]} label={title + " checked"} onChange={(v) => setChecks({ ...checks, [k]: v })} />}
      </div>
    );
    return (
      <>
        {NavBar({ title: "Check documents" })}
        <div className="px">
          <div style={{ display: "flex", justifyContent: "center", marginTop: 6 }}><Mono name={a.name} size={72} grey /></div>
          <div className="pname" style={{ fontSize: 24 }}>{a.name}</div>
          <div className="plevel">{a.level} · {a.base} · applied {a.submitted.toLowerCase()}</div>
          <div className="caps">Tick each one after you check it</div>
          <div className="group">
            {Row({ k: "card", title: "Ghana Card", value: a.docs.card + " · photo matches selfie?" })}
            {a.docs.ecNo ? Row({ k: "ec", title: "Energy Commission · " + a.ec, value: a.docs.ecNo + " · found in EC register?" }) : (
              <div className="li vrow" style={{ "--inset": "16px" }}>
                <div className="tx"><div className="tt"><span>Energy Commission</span></div><div className="st" style={{ color: "var(--red)" }}>No certificate uploaded</div></div>
                <span className="pill red">Missing</span>
              </div>
            )}
            {a.eng ? Row({ k: "eng", title: "Engineering Council", value: a.docs.engNo + " · registration valid?" }) : null}
          </div>
          <div className="foot">Check certificates in the Energy Commission's register of certified electricians and the Engineering Council's register. Sample documents.</div>
          <div style={{ height: 18 }} />
          {decided ? (
            <div className="card empty">{decided === "approved" ? a.name + " is approved and now shows in search." : a.name + " was rejected and told why."}</div>
          ) : (
            <div className="btnrow">
              <Btn kind="danger" label="Reject" onClick={() => { commit((s) => ({ ...s, rejected: [...s.rejected, a.id] })); toast(firstName(a.name) + " rejected"); }} />
              <Btn kind="green" label="Approve" disabled={!ready} onClick={() => commit((s) => ({ ...s, approved: [...s.approved, a.id] }), firstName(a.name) + " approved")} />
            </div>
          )}
          {!decided && missingEc ? <div className="foot" style={{ textAlign: "center" }}>Electrical work needs an Energy Commission certificate, so this person can't be approved yet.</div> : null}
        </div>
        <Spacer />
      </>
    );
  }

  const customerTabs = [
    { id: "home", Icon: TabHome, IconOn: TabHomeOn, label: "Home" },
    { id: "find", Icon: TabFind, IconOn: TabFindOn, label: "Find" },
    { id: "requests", Icon: TabReq, IconOn: TabReqOn, label: "Requests" },
    { id: "more", Icon: TabMore, IconOn: TabMoreOn, label: "More" },
  ];
  const proTabs = [
    { id: "home", Icon: TabHome, IconOn: TabHomeOn, label: "Today" },
    { id: "jobs", Icon: TabJobs, IconOn: TabJobsOn, label: "Jobs", n: inboxOpen.length },
    { id: "projects", Icon: TabDocs, IconOn: TabDocsOn, label: "Projects" },
    { id: "profile", Icon: TabMe, IconOn: TabMeOn, label: "Profile" },
    { id: "more", Icon: TabMore, IconOn: TabMoreOn, label: "More" },
  ];
  const tabs = isPro ? proTabs : customerTabs;
  const activeTab = tabs.some((t) => t.id === tab) ? tab : "home";

  let body;
  if (page) {
    body = {
      results: () => ResultsPage({ query: page.query }),
      pro: () => ProPage({ id: page.id, query: page.query, preview: page.preview || isPro }),
      request: () => RequestPage({ id: page.id }),
      project: () => ProjectPage({ id: page.id }),
      admin: () => AdminPage(),
      applicant: () => ApplicantPage({ id: page.id }),
      inbox: () => InboxPage({ id: page.id }),
      brief: () => BriefPage({ id: page.id }),
    }[page.type]();
  } else if (isPro) {
    body = { home: ProToday, jobs: ProJobs, projects: ProProjects, profile: ProProfile, more: More }[activeTab]();
  } else {
    body = { home: Home, find: Find, requests: Requests, more: More }[activeTab]();
  }

    <div className="vs-shell">
      <div className="vs-scroll" ref={scrollRef} key={(isPro ? "p" : "c") + activeTab + stack.length}>
        {body}
      </div>
      <div className="edgefade" />
      <nav className={"tabbar glass" + (isPro ? " wide" : "")} aria-label="Sections">
        {tabs.map(({ id, Icon, IconOn, label, n }) => {
          const on = activeTab === id;
          const I = on ? IconOn : Icon;
          return (
            <button key={id} className={"tab" + (on ? " on" : "")} aria-current={on ? "page" : undefined} onClick={() => goTab(id)}>
              <I size={25} strokeWidth={on ? 2.1 : 1.7} />

            </button>
          );
        })}
      </nav>
      {!isPro ? (
        <button className="fab glass" onClick={() => setMenu(menu === "add" ? null : "add")} aria-label="New request">
          <Plus size={26} strokeWidth={2.6} />
        </button>
      ) : null}

      {menu === "add" && (
        <PopMenu onClose={() => setMenu(null)} style={{ right: 12, bottom: "calc(max(env(safe-area-inset-bottom, 0px), 20px) + 66px)" }}
          items={[{ label: "Fix something", Icon: Bolt, onClick: () => openFix(null) }, { label: "Start a project", Icon: HouseLine, onClick: openBuild }]} />
      )}
      {menu === "me" && (
        <PopMenu onClose={() => setMenu(null)} style={{ right: 16, top: 76 }}
          items={[
            { label: isPro ? "Customer view" : "Professional view", Icon: Swap2, onClick: () => { commit((s) => ({ ...s, mode: isPro ? "customer" : "pro" })); goTab("home"); toast(isPro ? "Customer view" : "You are " + me.name); } },
            { label: "Verification queue", Icon: ShieldCheck, onClick: () => push({ type: "admin" }) },
          ]} />
      )}

      {sheet && sheet.type === "welcome" && <Welcome onClose={() => { setSheet(null); if (!st.seenWelcome) commit((s) => ({ ...s, seenWelcome: true })); }} />}
      {sheet && sheet.type === "fix" && (
        <FixSheet start={sheet} area={st.area} onArea={() => setAreaFor("sheet")} onClose={() => setSheet(null)}
          onFind={(q) => {
            setSheet(null);
            if (sheet.proId) {
              const p = proById(sheet.proId);
              if (!p.cats.includes(q.cat)) { toast(firstName(p.name) + " doesn't do " + catOf(q.cat).label.toLowerCase()); setStack([...stack, { type: "results", query: q }]); return; }

              return;

            setStack([...stack, { type: "results", query: q }]);
          }} />

      {sheet && sheet.type === "build" && <BuildSheet area={st.area} onArea={() => setAreaFor("sheet")} onClose={() => setSheet(null)} onPost={postProject} />}

      {sheet && sheet.type === "review" && (
        <ReviewSheet pro={proById(sheet.req.proId)} onClose={() => setSheet(null)}
          onSave={(rv) => { const ok = commit((s) => ({ ...s, requests: s.requests.map((x) => (x.id === sheet.req.id ? { ...x, review: rv } : x)) }), "Review saved"); if (ok) setSheet(null); }} />
      )}
      {sheet && sheet.type === "quote" && (
        <QuoteSheet brief={sheet.brief} onClose={() => setSheet(null)}
          onSend={(q) => { const ok = commit((s) => ({ ...s, pro: { ...s.pro, quotes: { ...s.pro.quotes, [sheet.brief.id]: q } } }), "Quote sent · GH₵ " + money(q.amount)); if (ok) setSheet(null); }} />
      )}
      {sheet && sheet.type === "hire" && (
        <Sheet title={"Choose " + firstName(proById(sheet.q.proId).name) + "?"} onClose={() => setSheet(null)}>

            <KV k="Price" v={"GH₵ " + money(sheet.q.amount)} />
            <KV k="Includes" v={sheet.q.materials ? "Labour + materials" : "Labour only"} />
            <KV k="Time" v={sheet.q.days + " days"} />
          </div>
          <div className="note" style={{ marginTop: 14 }}>
            <InfoCircle size={20} color="var(--tint)" />
            <div>The other professionals are told politely that you chose someone else. You agree payment stages with {firstName(proById(sheet.q.proId).name)} directly.</div>
          </div>
          <div style={{ height: 18 }} />
          <Btn label="Choose and share my number" onClick={() => {
            const ok = commit((s) => ({ ...s, projects: s.projects.map((x) => (x.id === sheet.pj.id ? { ...x, status: "hired", hiredProId: sheet.q.proId } : x)) }), "You chose " + firstName(proById(sheet.q.proId).name));
            if (ok) setSheet(null);
          }} />
        </Sheet>
      )}
      {sheet && sheet.type === "reset" && (
        <Sheet title="Reset the demo?" onClose={() => setSheet(null)}>
          <div style={{ fontSize: 16, color: "var(--sec)", lineHeight: 1.45, textAlign: "center", padding: "8px 6px 18px" }}>
            Your sample requests, projects, quotes and approvals are cleared. Your colour choice is kept.
          </div>
          <Btn kind="danger" label="Reset" onClick={() => { const a = st.accent; commit(() => ({ ...blank(), seenWelcome: true, accent: a })); setSheet(null); goTab("home"); toast("Demo reset"); }} />
        </Sheet>
      )}
      {areaFor && <AreaSheet value={st.area} onPick={setArea} onClose={() => setAreaFor(null)} />}

      {toastMsg && <div className="toast" key={toastMsg.k} role="status">{toastMsg.m}</div>}
      {done
        ? ReactDOM.createPortal(
            <div className="done" key={done.key} role="status" aria-live="polite">
              <svg className="done-ic" viewBox="0 0 52 52" aria-hidden="true">
                <circle className="done-c" cx="26" cy="26" r="24" />
                <path className="done-k" d="M15.5 27.2l7 7L37 19.2" />
              </svg>
              <div className="done-t">{done.msg}</div>
            </div>,
            document.body
          )
        : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
